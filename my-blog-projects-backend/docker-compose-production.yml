services:
  my-blog-projects-backend:
    build:
      context: .
      dockerfile: Dockerfile.production
    volumes:
      - ./public/uploads:/app/public/uploads
      - ./.tmp:/app/.tmp
    ports:
      - "1337:1337"
    environment:
      BROWSER: "none"
      SHELL: "/bin/bash"
      NODE_ENV: "production"